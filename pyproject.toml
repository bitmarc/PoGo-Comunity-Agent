[project]
name = "hxq-agent"
version = "0.1.0"
description = "Agente copiloto de comunicacion para administradores de una comunidad local de Pokemon GO"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "agent-framework-core>=1.19.0",
    "chainlit>=2.12.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "agent-framework-foundry>=1.13.1",
    "tzdata>=2026.4",
    "asyncpg>=0.31.0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b57",
    "jinja2>=3.1.6",
    "playwright>=1.63.0",
    "icalendar>=7.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hxq_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["lento: exige Chromium; se saltan con -m \"not lento\""]
