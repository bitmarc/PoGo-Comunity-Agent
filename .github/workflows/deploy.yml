name: Deploy

# Construye la imagen en GHCR y actualiza la Container App.
#
# Configuracion previa (una vez):
#   1. Crear una app registration en Entra con federated credential para este repo:
#        az ad app create --display-name hxq-agent-deploy
#        az ad app federated-credential create --id <appId> --parameters '{
#          "name":"github","issuer":"https://token.actions.githubusercontent.com",
#          "subject":"repo:<owner>/<repo>:ref:refs/heads/main",
#          "audiences":["api://AzureADTokenExchange"]}'
#      y darle rol Contributor sobre el resource group.
#   2. Secrets del repo: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   3. Variables del repo: AZURE_RESOURCE_GROUP, CONTAINER_APP_NAME
#
# Se usa OIDC en vez de un secreto de service principal: no hay credencial de larga
# vida que rotar ni que se pueda filtrar.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  # Un despliegue a la vez. Si llegan dos pushes seguidos, gana el ultimo.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEN: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen --extra dev

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Tests
        run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagen: ${{ steps.meta.outputs.imagen }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas
        id: meta
        run: |
          # El SHA como tag principal: 'latest' no sirve para saber que hay desplegado
          # ni para volver atras.
          echo "imagen=${IMAGEN}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.imagen }}
            ${{ env.IMAGEN }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # necesario para OIDC
      contents: read
    steps:
      - name: Login en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar la Container App
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.imagen }}"

      - name: Comprobar que responde
        run: |
          FQDN=$(az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          echo "Comprobando https://$FQDN ..."
          # --retry-connrefused por si la revision nueva aun esta arrancando.
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            --retry-connrefused --max-time 180 -o /dev/null "https://$FQDN/"
          echo "Desplegado y respondiendo: https://$FQDN"
